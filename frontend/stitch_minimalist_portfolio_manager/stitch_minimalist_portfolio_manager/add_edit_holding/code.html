<html lang="en"><head><meta charset="utf-8"/><meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@500&amp;display=swap" rel="stylesheet"/><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/><style>@layer base{html,body{width:100vw;margin:0;padding:0;overflow-x:hidden;}body{overscroll-behavior:none;}.pb-safe{padding-bottom:env(safe-area-inset-bottom,0px);}.pt-safe{padding-top:env(safe-area-inset-top,0px);}}::-webkit-scrollbar{display:none;}</style><script src="https://cdn.tailwindcss.com"></script><script id="tailwind-config">tailwind.config={darkMode:"class",theme:{extend:{colors:{"tertiary":"#9e3d00","on-secondary":"#ffffff","surface-container-high":"#e8e8ea","on-tertiary-container":"#fffbff","surface-tint":"#005bc1","surface":"#f9f9fb","surface-container-lowest":"#ffffff","on-tertiary-fixed":"#351000","on-secondary-fixed-variant":"#474649","inverse-on-surface":"#f0f0f2","on-error-container":"#93000a","primary-fixed-dim":"#adc6ff","on-surface-variant":"#414755","surface-dim":"#d9dadc","on-surface":"#1a1c1d","secondary-container":"#e1dfe1","primary":"#0058bc","secondary-fixed-dim":"#c8c6c8","on-background":"#1a1c1d","on-secondary-fixed":"#1b1b1d","secondary-fixed":"#e4e2e4","surface-container-highest":"#e2e2e4","inverse-surface":"#2f3132","tertiary-fixed-dim":"#ffb595","surface-container":"#eeeef0","on-secondary-container":"#636264","primary-container":"#0070eb","surface-variant":"#e2e2e4","error-container":"#ffdad6","on-tertiary":"#ffffff","tertiary-container":"#c64f00","secondary":"#5f5e60","inverse-primary":"#adc6ff","error":"#ba1a1a","on-error":"#ffffff","outline-variant":"#c1c6d7","tertiary-fixed":"#ffdbcc","background":"#f9f9fb","surface-container-low":"#f3f3f5","primary-fixed":"#d8e2ff","surface-bright":"#f9f9fb","outline":"#717786","on-primary-fixed-variant":"#004493","on-primary-fixed":"#001a41","on-primary-container":"#fefcff","on-primary":"#ffffff","on-tertiary-fixed-variant":"#7c2e00"},borderRadius:{DEFAULT:"0.25rem",lg:"0.5rem",xl:"0.75rem",full:"9999px"},spacing:{sm:"8px",md:"16px",base:"4px",lg:"24px",xs:"4px",xl:"32px",gutter:"16px",margin:"24px"},fontFamily:{body:["Inter"],display:["Inter"],"data-md":["JetBrains Mono"],"data-lg":["JetBrains Mono"],headline:["Inter"],title:["Inter"],"data-sm":["JetBrains Mono"],"body-sm":["Inter"]},fontSize:{body:["14px",{lineHeight:"20px",fontWeight:"400"}],display:["32px",{lineHeight:"40px",letterSpacing:"-0.02em",fontWeight:"700"}],"data-md":["14px",{lineHeight:"20px",fontWeight:"500"}],"data-lg":["18px",{lineHeight:"24px",fontWeight:"500"}],headline:["24px",{lineHeight:"32px",letterSpacing:"-0.01em",fontWeight:"600"}],title:["18px",{lineHeight:"24px",fontWeight:"600"}],"data-sm":["12px",{lineHeight:"16px",fontWeight:"500"}],"body-sm":["12px",{lineHeight:"16px",fontWeight:"400"}]}}}}</script></head><body class="bg-surface font-body text-on-surface"><header class="fixed top-0 w-full z-50 bg-surface/80 backdrop-blur-xl pt-safe shadow-[0_1px_8px_rgba(0,0,0,0.04)]"><div class="h-14 px-gutter flex items-center gap-md"><button class="w-10 h-10 -ml-2 flex items-center justify-center text-on-surface hover:bg-surface-container rounded-full transition-colors" onclick="history.back()"><span class="material-symbols-outlined">arrow_back_ios_new</span></button><div class="flex items-center gap-sm"><img alt="Logo" class="h-6 w-auto opacity-80" src="https://lh3.googleusercontent.com/aida-public/AB6AXuD4ZJNclMsSggALGV5CL2DoOM3efzFDFe9QaEVJlzm8EdWJwA9KSnAv6l0FBUH6673UZJ41nSeKCDv2c5zsC4tXo0rRcN3b_fSJCKDyMc81ZlikBM-ZwaH32ZxP7xUFGG5nrw5LMBUQJrP4uhRphUGWzFC7NFqvF96r-HEwik7CtguzZ9AUuIq9mYIP3DywqeKrlO_iAZOeDmuG-hAiS45wv_rIo3jzW2V58WTVzOeiKBSDtC0kZ4N7"/><span class="font-title text-title text-on-surface">Asset Details</span></div></div></header><main class="relative w-full pt-14 bg-surface min-h-screen"><div class="flex flex-col w-full px-gutter pb-safe">
<form class="flex flex-col w-full gap-xl py-margin" id="holding-form">
<!-- Asset Info Section -->
<section class="flex flex-col gap-md bg-surface-container-lowest rounded-xl p-md shadow-sm">
<div class="flex items-center gap-sm mb-xs">
<div class="w-8 h-8 rounded-full bg-primary-container text-on-primary-container flex items-center justify-center">
<span class="material-symbols-outlined" style="font-size: 18px;">search</span>
</div>
<h2 class="font-title text-title text-on-surface">Asset Identification</h2>
</div>
<!-- Symbol -->
<div class="flex flex-col gap-xs">
<label class="font-body-sm text-on-surface-variant ml-1" for="symbol">Ticker / Symbol</label>
<div class="relative flex items-center bg-surface-container rounded-lg h-12 px-md transition-colors focus-within:bg-surface-container-highest">
<input autocomplete="off" class="w-full bg-transparent outline-none font-body text-on-surface uppercase placeholder:text-on-surface-variant/40" id="symbol" placeholder="e.g. AAPL" type="text"/>
</div>
</div>
<!-- Name -->
<div class="flex flex-col gap-xs">
<label class="font-body-sm text-on-surface-variant ml-1" for="name">Asset Name</label>
<div class="relative flex items-center bg-surface-container rounded-lg h-12 px-md transition-colors focus-within:bg-surface-container-highest">
<input autocomplete="off" class="w-full bg-transparent outline-none font-body text-on-surface placeholder:text-on-surface-variant/40" id="name" placeholder="Apple Inc." type="text"/>
</div>
</div>
<!-- Type -->
<div class="flex flex-col gap-xs">
<label class="font-body-sm text-on-surface-variant ml-1" for="type">Asset Type</label>
<div class="relative flex items-center bg-surface-container rounded-lg h-12 px-md transition-colors focus-within:bg-surface-container-highest">
<select class="w-full bg-transparent outline-none font-body text-on-surface appearance-none z-10 cursor-pointer" id="type">
<option value="stock">Equities (Stock)</option>
<option value="crypto">Cryptocurrency</option>
<option value="etf">ETF / Mutual Fund</option>
<option value="cash">Cash Equivalent</option>
</select>
<span class="material-symbols-outlined absolute right-md text-on-surface-variant pointer-events-none">unfold_more</span>
</div>
</div>
</section>
<!-- Position Details Section -->
<section class="flex flex-col gap-md bg-surface-container-lowest rounded-xl p-md shadow-sm">
<div class="flex items-center gap-sm mb-xs">
<div class="w-8 h-8 rounded-full bg-tertiary-container text-on-tertiary-container flex items-center justify-center">
<span class="material-symbols-outlined" style="font-size: 18px;">account_balance_wallet</span>
</div>
<h2 class="font-title text-title text-on-surface">Position Details</h2>
</div>
<!-- Quantity -->
<div class="flex flex-col gap-xs">
<label class="font-body-sm text-on-surface-variant ml-1" for="quantity">Total Quantity</label>
<div class="relative flex items-center bg-surface-container rounded-lg h-14 px-md transition-colors focus-within:bg-surface-container-highest">
<input class="w-full bg-transparent outline-none font-data-lg text-on-surface placeholder:text-on-surface-variant/40" id="quantity" placeholder="0.00" step="any" type="number"/>
</div>
</div>
<!-- Average Price -->
<div class="flex flex-col gap-xs">
<label class="font-body-sm text-on-surface-variant ml-1" for="price">Average Buy Price</label>
<div class="relative flex items-center bg-surface-container rounded-lg h-14 px-md transition-colors focus-within:bg-surface-container-highest">
<span class="font-data-lg text-on-surface-variant mr-xs">$</span>
<input class="w-full bg-transparent outline-none font-data-lg text-on-surface placeholder:text-on-surface-variant/40" id="price" placeholder="0.00" step="any" type="number"/>
</div>
</div>
<!-- Interactive Cost Calculation -->
<div class="flex items-center justify-between mt-sm px-2 py-sm bg-surface-container-low rounded-lg">
<span class="font-body-sm text-on-surface-variant">Estimated Total Cost</span>
<span class="font-data-md text-primary" id="total-cost">$0.00</span>
</div>
</section>
<!-- Floating Action Area -->
<div class="mt-xl">
<button class="w-full h-14 bg-primary text-on-primary rounded-xl font-title text-title flex items-center justify-center gap-sm shadow-md transition-transform active:scale-95 hover:bg-primary/90" type="button">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">check_circle</span>
        Save Holding
      </button>
</div>
</form>
</div>
<script>
  document.addEventListener('DOMContentLoaded', () => {
    const qtyInput = document.getElementById('quantity');
    const priceInput = document.getElementById('price');
    const totalCostDisplay = document.getElementById('total-cost');
    const typeSelect = document.getElementById('type');
    const symbolInput = document.getElementById('symbol');

    // Dynamic cost calculation
    const calculateTotal = () => {
      const qty = parseFloat(qtyInput.value) || 0;
      const price = parseFloat(priceInput.value) || 0;
      const total = qty * price;
      
      // Format as currency
      totalCostDisplay.textContent = new Intl.NumberFormat('en-US', {
        style: 'currency',
        currency: 'USD'
      }).format(total);
    };

    qtyInput.addEventListener('input', calculateTotal);
    priceInput.addEventListener('input', calculateTotal);

    // Auto-fill mock data for crypto if symbol matches
    symbolInput.addEventListener('blur', (e) => {
      const val = e.target.value.toUpperCase();
      if (val === 'BTC' || val === 'ETH') {
        typeSelect.value = 'crypto';
      }
    });
  });
</script></main></body></html>
