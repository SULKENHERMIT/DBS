<link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet"/></head><body class="bg-background font-body text-on-background"><main class="w-full flex items-center justify-center min-h-screen"><div class="flex flex-col w-full h-[calc(100vh-64px)] items-center justify-center p-md">
<div class="relative w-full max-w-[400px]">
<!-- Decorative subtle background glow -->
<div class="absolute -inset-1 bg-gradient-to-r from-primary/10 to-surface-tint/10 rounded-xl blur-lg z-0"></div>
<div class="relative z-10 bg-surface-container-lowest rounded-xl p-xl shadow-md flex flex-col gap-lg border-t border-surface-variant/50">
<!-- Header / Logo Area -->
<div class="flex flex-col items-center justify-center gap-sm mt-sm mb-sm text-center">
<div class="w-12 h-12 bg-primary/10 rounded-full flex items-center justify-center mb-sm text-primary">
<span class="material-symbols-outlined" style="font-size: 28px; font-variation-settings: 'FILL' 1;">security</span>
</div>
<h1 class="font-headline text-headline text-on-surface">Welcome Back</h1>
<p class="font-body text-body text-on-surface-variant">Sign in to access your dashboard</p>
</div>
<!-- Form -->
<form class="flex flex-col gap-md" onsubmit="event.preventDefault();">
<!-- Email Field -->
<div class="flex flex-col gap-xs group relative">
<label class="font-data-sm text-data-sm text-on-surface-variant uppercase tracking-wider pl-1" for="email">Email Address</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline group-focus-within:text-primary transition-colors duration-200 pointer-events-none" style="font-size: 20px;">mail</span>
<input autocomplete="email" class="w-full bg-surface-container-low text-on-surface font-body text-body py-3 pl-10 pr-4 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary/20 transition-all duration-200 placeholder:text-outline-variant" id="email" placeholder="name@company.com" required="" type="email"/>
</div>
</div>
<!-- Password Field -->
<div class="flex flex-col gap-xs group relative">
<div class="flex items-center justify-between pl-1 pr-1">
<label class="font-data-sm text-data-sm text-on-surface-variant uppercase tracking-wider" for="password">Password</label>
<a class="font-data-sm text-data-sm text-primary hover:text-primary-container transition-colors duration-200" href="#">Forgot?</a>
</div>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline group-focus-within:text-primary transition-colors duration-200 pointer-events-none" style="font-size: 20px;">lock</span>
<input autocomplete="current-password" class="w-full bg-surface-container-low text-on-surface font-body text-body py-3 pl-10 pr-10 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary/20 transition-all duration-200 placeholder:text-outline-variant" id="password" placeholder="••••••••" required="" type="password"/>
<button aria-label="Toggle password visibility" class="absolute right-3 top-1/2 -translate-y-1/2 text-outline hover:text-on-surface transition-colors duration-200 focus:outline-none" type="button">
<span class="material-symbols-outlined" style="font-size: 20px;">visibility</span>
</button>
</div>
</div>
<!-- Remember Me -->
<div class="flex items-center gap-sm mt-1 mb-1">
<div class="relative flex items-center justify-center">
<input class="peer appearance-none w-4 h-4 rounded-sm bg-surface-container-low checked:bg-primary focus:outline-none focus:ring-2 focus:ring-primary/20 transition-all duration-200 cursor-pointer" id="remember" type="checkbox"/>
<span class="material-symbols-outlined absolute text-on-primary pointer-events-none opacity-0 peer-checked:opacity-100 transition-opacity duration-200" style="font-size: 14px; font-variation-settings: 'FILL' 1;">check</span>
</div>
<label class="font-body text-body text-on-surface-variant cursor-pointer select-none hover:text-on-surface transition-colors duration-200" for="remember">Remember this device</label>
</div>
<!-- Submit Button -->
<button class="w-full bg-primary text-on-primary font-title text-title py-3 rounded-lg hover:bg-primary-container focus:outline-none focus:ring-4 focus:ring-primary/20 active:scale-[0.98] transition-all duration-200 shadow-sm hover:shadow-md flex items-center justify-center gap-sm mt-sm" type="submit">
                    Sign In
                    <span class="material-symbols-outlined" style="font-size: 20px;">arrow_forward</span>
</button>
</form>
<!-- Footer -->
<div class="text-center mt-sm pt-md border-t border-surface-variant/30">
<p class="font-body text-body text-on-surface-variant">
                    Don't have an account? 
                    <a class="font-title text-body text-primary hover:text-primary-container transition-colors duration-200" href="#">Request Access</a>
</p>
</div>
</div>
<!-- Environment Indicator (Decorative) -->
<div class="absolute -bottom-12 left-0 right-0 flex justify-center gap-sm items-center text-on-surface-variant/50 font-data-sm text-data-sm">
<span class="w-2 h-2 rounded-full bg-primary/40"></span>
            SECURE CONNECTION
        </div>
</div>
</div></main></body></html>
