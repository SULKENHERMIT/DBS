<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Precision Portfolio Manager - Live Stock & Crypto Analytics</title>

  <!-- Google Fonts & Material Symbols -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "outline-variant": "#c1c6d7",
            "surface": "#f9f9fb",
            "on-tertiary-fixed": "#351000",
            "on-secondary-container": "#636264",
            "primary-fixed": "#d8e2ff",
            "secondary-fixed-dim": "#c8c6c8",
            "on-surface": "#1a1c1d",
            "on-tertiary-fixed-variant": "#7c2e00",
            "surface-container-low": "#f3f3f5",
            "secondary": "#5f5e60",
            "surface-container-lowest": "#ffffff",
            "inverse-on-surface": "#f0f0f2",
            "on-secondary-fixed-variant": "#474649",
            "on-primary": "#ffffff",
            "surface-container-high": "#e8e8ea",
            "on-error": "#ffffff",
            "surface-tint": "#005bc1",
            "on-tertiary-container": "#fffbff",
            "on-tertiary": "#ffffff",
            "surface-container": "#eeeef0",
            "primary-container": "#0070eb",
            "tertiary-container": "#c64f00",
            "on-primary-fixed-variant": "#004493",
            "primary-fixed-dim": "#adc6ff",
            "surface-bright": "#f9f9fb",
            "surface-dim": "#d9dadc",
            "tertiary": "#00875A",
            "tertiary-fixed": "#E3FCEF",
            "on-tertiary-fixed": "#006644",
            "primary": "#0058bc",
            "error": "#ba1a1a",
            "tertiary-fixed-dim": "#ffb595",
            "on-secondary": "#ffffff",
            "secondary-container": "#e1dfe1",
            "on-surface-variant": "#414755",
            "on-error-container": "#93000a",
            "surface-variant": "#e2e2e4",
            "outline": "#717786",
            "surface-container-highest": "#e2e2e4",
            "background": "#f9f9fb",
            "error-container": "#ffdad6",
            "on-secondary-fixed": "#1b1b1d",
            "inverse-primary": "#adc6ff",
            "inverse-surface": "#2f3132",
            "secondary-fixed": "#e4e2e4",
            "on-background": "#1a1c1d",
            "on-primary-container": "#fefcff",
            "on-primary-fixed": "#001a41"
          },
          borderRadius: {
            DEFAULT: "0.25rem",
            lg: "0.5rem",
            xl: "0.75rem",
            "2xl": "1rem",
            full: "9999px"
          },
          spacing: {
            base: "4px",
            xs: "4px",
            sm: "8px",
            xl: "32px",
            margin: "24px",
            gutter: "16px",
            md: "16px",
            lg: "24px"
          },
          fontFamily: {
            body: ["Inter", "sans-serif"],
            display: ["Inter", "sans-serif"],
            headline: ["Inter", "sans-serif"],
            title: ["Inter", "sans-serif"],
            "body-sm": ["Inter", "sans-serif"],
            "data-lg": ["JetBrains Mono", "monospace"],
            "data-md": ["JetBrains Mono", "monospace"],
            "data-sm": ["JetBrains Mono", "monospace"]
          },
          fontSize: {
            display: ["32px", { lineHeight: "40px", letterSpacing: "-0.02em", fontWeight: "700" }],
            headline: ["24px", { lineHeight: "32px", letterSpacing: "-0.01em", fontWeight: "600" }],
            title: ["18px", { lineHeight: "24px", fontWeight: "600" }],
            body: ["14px", { lineHeight: "20px", fontWeight: "400" }],
            "body-sm": ["12px", { lineHeight: "16px", fontWeight: "400" }],
            "data-lg": ["18px", { lineHeight: "24px", fontWeight: "600" }],
            "data-md": ["14px", { lineHeight: "20px", fontWeight: "500" }],
            "data-sm": ["12px", { lineHeight: "16px", fontWeight: "500" }]
          }
        }
      }
    };
  </script>

  <!-- Custom CSS -->
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body class="bg-background font-body text-on-background antialiased selection:bg-primary/20 selection:text-primary">
  <!-- Root App Mount -->
  <div id="app-root"></div>

  <!-- Dynamic Modal Overlay Root -->
  <div id="modal-container"></div>

  <!-- Toast Notification Stack -->
  <div id="toast-container"></div>

  <!-- Charting Library (Chart.js) -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <!-- Scripts -->
  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
